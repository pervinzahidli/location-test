
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GPS Location</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      background: #0d1117;
      color: #e6edf3;

      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;

      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;

      padding: 35px 25px;
      text-align: center;

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .description {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 16px;

      background: #238636;
      border: none;
      border-radius: 10px;

      color: white;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .success {
      color: #3fb950;
    }

    .error {
      color: #f85149;
    }

    .loading {
      color: #58a6ff;
    }

    .warning-box {
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid #f85149;
      border-radius: 12px;
      padding: 20px 15px;
      margin-top: 15px;
    }

    .warning-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .warning-title {
      color: #f85149;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .warning-text {
      color: #c9d1d9;
      font-size: 13px;
      line-height: 1.8;
    }

    .coordinates {
      margin-top: 15px;
      padding: 15px;

      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;

      text-align: left;
      font-family: monospace;
      font-size: 13px;
    }

    .map-link {
      display: block;
      margin-top: 15px;
      padding: 12px;

      background: #21262d;
      color: #58a6ff;

      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }

    .footer {
      margin-top: 25px;
      font-size: 11px;
      color: #6e7681;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">📍</div>

    <h1>GPS Location</h1>

    <p class="description">
      Konumunu əldə etmək və Telegram botuna
      göndərmək üçün aşağıdakı düyməyə bas.
      Konum yalnız icazə verdikdən sonra paylaşılacaq.
    </p>

    <button id="locationBtn" onclick="getLocation()">
      📍 Konumumu Telegram-a göndər
    </button>

    <div id="result" role="status" aria-live="polite"></div>

    <div class="footer">
      GPS Location Test
    </div>

  </div>

  <script>

    // Cloudflare Worker
    const WORKER_URL =
      "https://pervin-location-bot.zaxidlipervin.workers.dev";


    // Telegram-a konum göndər
    async function sendLocation(lat, lon, accuracy) {

      const response = await fetch(WORKER_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          lat: lat,
          lon: lon,
          accuracy: accuracy
        })
      });

      if (!response.ok) {
        throw new Error("Telegram bağlantısında xəta baş verdi.");
      }

      return await response.json();
    }


    // GPS funksiyası
    function getLocation() {

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("locationBtn");


      // Brauzer GPS dəstəkləmirsə
      if (!navigator.geolocation) {

        showLocationWarning(
          "Brauzeriniz konum funksiyasını dəstəkləmir."
        );

        return;
      }


      button.disabled = true;
      button.textContent = "⏳ Konum alınır...";

      result.innerHTML = `
        <p class="loading">
          📡 GPS koordinatları əldə edilir...
        </p>

        <p style="color:#8b949e;font-size:12px;">
          Maksimum 15 saniyə gözləyin.
        </p>
      `;


      navigator.geolocation.getCurrentPosition(

        // GPS uğurlu olduqda
        async function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const mapLink =
            `https://www.google.com/maps?q=${lat},${lon}`;

          result.innerHTML = `
            <p class="loading">
              📤 Konum Telegram-a göndərilir...
            </p>
          `;

          try {

            // Avtomatik Telegram-a göndər
            await sendLocation(lat, lon, accuracy);

            result.innerHTML = `

              <p class="success">
                ✅ Konum uğurla Telegram-a göndərildi!
              </p>

              <div class="coordinates">

                <div>
                  <strong>Latitude:</strong> ${lat}
                </div>

                <div>
                  <strong>Longitude:</strong> ${lon}
                </div>

                <div>
                  <strong>Dəqiqlik:</strong>
                  ${Math.round(accuracy)} metr
                </div>

              </div>

              <a
                class="map-link"
                href="${mapLink}"
                target="_blank"
                rel="noopener noreferrer"
              >
                🗺 Google Maps-də bax
              </a>

            `;

          } catch (error) {

            result.innerHTML = `
              <div class="warning-box">
                <div class="warning-icon">⚠️</div>

                <div class="warning-title">
                  Telegram-a göndərilmədi
                </div>

                <div class="warning-text">
                  İnternet bağlantınızı yoxlayın
                  və yenidən cəhd edin.
                </div>
              </div>
            `;

          }

          button.disabled = false;
          button.textContent =
            "📍 Yenidən konum göndər";

        },


        // GPS xətası
        function(error) {

          let message = "";

          switch(error.code) {

            case 1:
              message =
                "Konum icazəsi verilməyib. " +
                "Brauzerinizin sayt ayarlarından " +
                "konum icazəsini aktivləşdirin " +
                "və yenidən cəhd edin.";
              break;

            case 2:
              message =
                "Konum müəyyən edilə bilmədi. " +
                "Telefonunuzun konum (GPS) " +
                "funksiyasını aktivləşdirin və " +
                "sayta yenidən daxil olun.";
              break;

            case 3:
              message =
                "Konum 15 saniyə ərzində əldə edilmədi. " +
                "Zəhmət olmasa, telefonunuzun " +
                "konum (GPS) funksiyasını " +
                "aktivləşdirin və sayta " +
                "yenidən daxil olun.";
              break;

            default:
              message =
                "Konum alınarkən xəta baş verdi. " +
                "Yenidən cəhd edin.";
          }

          showLocationWarning(message);

          button.disabled = false;
          button.textContent =
            "🔄 Yenidən yoxla";

        },


        // GPS ayarları
        {
          enableHighAccuracy: false,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }


    // Xəbərdarlıq göstər
    function showLocationWarning(message) {

      const result =
        document.getElementById("result");

      result.innerHTML = `
        <div class="warning-box">

          <div class="warning-icon">
            📍
          </div>

          <div class="warning-title">
            Konum əldə edilə bilmədi!
          </div>

          <div class="warning-text">
            ${message}
          </div>

        </div>
      `;
    }

  </script>

</body>
</html>
