
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Send a Message</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 12px;
    }

    .description {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      resize: vertical;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      color: #e6edf3;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #238636;
    }

    textarea::placeholder {
      color: #6e7681;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .success {
      color: #3fb950;
    }

    .error {
      color: #f85149;
    }

    .footer {
      margin-top: 25px;
      color: #6e7681;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">💬</div>

    <h1>Send a Message</h1>

    <p class="description">
      Have something to say?
      Write your message below and send it directly to me.
    </p>

    <form id="messageForm">

      <textarea
        id="message"
        placeholder="Type your message here anonymously..."
        maxlength="1000"
        required
      ></textarea>

      <button id="sendBtn" type="submit">
        ✉️ Send Message
      </button>

    </form>

    <div id="status"
         role="status"
         aria-live="polite"></div>

  </main>

  <script>

    const WORKER_URL =
      "https://pervin-location-bot.zaxidlipervin.workers.dev";

    const form =
      document.getElementById("messageForm");

    const messageInput =
      document.getElementById("message");

    const sendBtn =
      document.getElementById("sendBtn");

    const status =
      document.getElementById("status");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) {
        status.className = "error";
        status.textContent = "Please enter a message.";
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      status.className = "";
      status.textContent = "";

      try {

        const response = await fetch(
          WORKER_URL + "/message",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        if (!response.ok) {
          throw new Error("Failed to send");
        }

        status.className = "success";
        status.textContent =
          "✅ Your message has been sent successfully!";

        messageInput.value = "";

      } catch (error) {

        status.className = "error";
        status.textContent =
          "❌ Failed to send. Please try again.";

      } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "✉️ Send Message";

      }

    });

  </script>

</body>
</html>
